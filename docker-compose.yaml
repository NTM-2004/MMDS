services:
  db:
    # Đổi thành pg15 (thêm chữ pg viết liền)
    image: pgvector/pgvector:pg15
    container_name: postgres_speech
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: speech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local